<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú del Día | Gastro-Bar</title>
    <style>
        /* --- ARQUITECTURA DE ESTILOS CSS (Diseño Limpio y Premium) --- */
        :root {
            --bg-color: #0f0f11;       /* Fondo oscuro elegante */
            --card-bg: #1a1a1e;        /* Fondo de la carta */
            --accent-color: #d4af37;   /* Dorado premium para detalles */
            --text-main: #f5f5f7;      /* Texto principal */
            --text-muted: #a1a1aa;     /* Texto secundario */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .menu-container {
            max-width: 480px;
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a30;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .date-badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 14px;
            color: var(--text-muted);
            border: 1px solid #3a3a42;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .section-title {
            font-size: 18px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 25px 0 15px 0;
            border-bottom: 1px solid #3a3a42;
            padding-bottom: 5px;
        }

        .menu-item {
            margin-bottom: 16px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-name {
            font-size: 16px;
            font-weight: 500;
            padding-right: 15px;
        }

        .item-dots {
            flex-grow: 1;
            border-bottom: 1px dashed #3a3a42;
            margin: 0 10px;
            position: relative;
            top: -4px;
        }

        .item-price {
            font-weight: 600;
            color: var(--text-main);
        }

        .item-description {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        footer {
            margin-top: 35px;
            text-align: center;
            background: #222227;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #2a2a30;
        }

        .total-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .footer-info {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <header>
            <h1 id="bar-name">Gastro-Bar</h1>
            <div id="menu-date" class="date-badge">Cargando fecha...</div>
        </header>

        <main>
            <div class="section-title">Primeros Platos</div>
            <div id="primeros-container"></div>

            <div class="section-title">Segundos Platos</div>
            <div id="segundos-container"></div>
        </main>

        <footer>
            <div id="menu-price" class="total-price">--€</div>
            <div id="menu-includes" class="footer-info">Incluye pan, bebida y postre</div>
        </footer>
    </div>

    <script>
        async function cargarMenu() {
            try {
                // Añadimos un timestamp para evitar que el navegador guarde en caché el menú viejo
                const respuesta = await fetch(`menu.json?v=${new Date().getTime()}`);
                const datos = await respuesta.json();

                // Setear metadatos
                document.getElementById('bar-name').innerText = datos.nombreBar;
                document.getElementById('menu-date').innerText = datos.fecha;
                document.getElementById('menu-price').innerText = `Precio Menú: ${datos.precioMenu}`;
                document.getElementById('menu-includes').innerText = datos.incluye;

                // Renderizar platos
                renderizarSeccion(datos.primeros, 'primeros-container');
                renderizarSeccion(datos.segundos, 'segundos-container');

            } catch (error) {
                console.error("Error al cargar el menú:", error);
                document.getElementById('menu-date').innerText = "Error al cargar el menú actual.";
            }
        }

        function renderizarSeccion(platos, containerId) {
            const contenedor = document.getElementById(containerId);
            contenedor.innerHTML = ''; // Limpiar

            platos.forEach(plato => {
                const itemHtml = `
                    <div class="menu-item">
                        <div class="item-row">
                            <span class="item-name">${plato.nombre}</span>
                            <span class="item-dots"></span>
                            <span class="item-price">${plato.precio || ''}</span>
                        </div>
                        ${plato.descripcion ? `<div class="item-description">${plato.descripcion}</div>` : ''}
                    </div>
                `;
                contenedor.innerHTML += itemHtml;
            });
        }

        // Ejecutar al cargar la página
        window.onload = cargarMenu;
    </script>
</body>
</html>
